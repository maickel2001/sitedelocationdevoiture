<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="carGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Cercle de fond avec ombre -->
  <circle cx="100" cy="100" r="90" fill="url(#logoGradient)" stroke="#1e40af" stroke-width="4" filter="url(#shadow)"/>
  
  <!-- Voiture stylisée -->
  <g filter="url(#shadow)">
    <!-- Corps principal de la voiture -->
    <rect x="40" y="120" width="120" height="40" rx="20" fill="url(#carGradient)"/>
    
    <!-- Toit de la voiture -->
    <rect x="50" y="100" width="100" height="30" rx="15" fill="url(#carGradient)"/>
    
    <!-- Capot -->
    <rect x="70" y="80" width="60" height="25" rx="12" fill="url(#carGradient)"/>
    
    <!-- Roues avec jantes -->
    <circle cx="70" cy="160" r="18" fill="#1e40af" stroke="#0f172a" stroke-width="2"/>
    <circle cx="70" cy="160" r="12" fill="#e2e8f0"/>
    <circle cx="70" cy="160" r="8" fill="#1e40af"/>
    
    <circle cx="130" cy="160" r="18" fill="#1e40af" stroke="#0f172a" stroke-width="2"/>
    <circle cx="130" cy="160" r="12" fill="#e2e8f0"/>
    <circle cx="130" cy="160" r="8" fill="#1e40af"/>
    
    <!-- Phares -->
    <circle cx="60" cy="95" r="8" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
    <circle cx="140" cy="95" r="8" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
    
    <!-- Vitres -->
    <path d="M75 85 L125 85 L120 65 L80 65 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    
    <!-- Poignées de porte -->
    <rect x="85" y="110" width="4" height="8" rx="2" fill="#64748b"/>
    <rect x="111" y="110" width="4" height="8" rx="2" fill="#64748b"/>
    
    <!-- Antenne -->
    <line x1="110" y1="85" x2="110" y2="70" stroke="#64748b" stroke-width="2"/>
    <circle cx="110" cy="68" r="2" fill="#64748b"/>
  </g>
  
  <!-- Texte "AutoLoc" -->
  <text x="100" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">
    AutoLoc Bénin
  </text>
</svg>